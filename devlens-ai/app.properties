devlens.app.incoming.request.db=mongo
devlens.app.incoming.request.schema.name=devlens_transactional
# Walker properties
devlens.app.walker.excluded_dirs=.git,node_modules,target,build,dist,__pycache__,.idea,.vscode,vendor,venv,.venv
devlens.app.walker.allowed_extensions=.java,.py,.js,.ts,.jsx,.tsx,.go,.rs,.cpp,.c,.h,.cs,.rb,.php,.swift,.kt,.scala,.sql,.yaml,.yml,.json,.md,.xml,.html,.css
devlens.app.walker.max_file_size = 500
# LLM properties (Groq)
devlens.app.llm.chat_model=openai/gpt-oss-120b
devlens.app.llm.router_model=openai/gpt-oss-20b
devlens.app.llm.overview_model=openai/gpt-oss-120b
# RAG properties
devlens.app.rag.rerank_enabled=true
devlens.app.rag.max_history_messages=6
devlens.app.rag.max_context_chars=12000
devlens.app.rag.max_history_chars=3000
devlens.app.llm.max_output_tokens=2500
